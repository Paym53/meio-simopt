# Render Blueprint: the MEIO web API (api.py) as one web service.
# Render reads this file when you create the service with New -> Blueprint.
# Keep it in sync with api.py; tests/test_deployment.py checks the important parts.
services:
  - type: web
    name: meio-simopt-api
    runtime: python
    # free: 512 MB, 0.1 CPU, sleeps after 15 idle minutes -> a "quick" run takes ~15+ min.
    # starter (paid): 512 MB, 0.5 CPU, always on -> a "quick" run takes ~3-4 min.
    plan: free
    # Cannot be changed after creation. Pick the region closest to your Supabase project.
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    # One process only: the run registry and the one-run-at-a-time lock live in memory.
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    # Deploy a new commit on main only after the GitHub Actions tests have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION          # same version as CI (.github/workflows/tests.yml)
        value: 3.11.9
      - key: MEIO_API_KEY            # random key generated by Render; copy it into Supabase secrets
        generateValue: true
      - key: MEIO_ALLOWED_PRESETS    # "full" peaks at ~450 MB, too close to the 512 MB limit
        value: quick,standard
      - key: MEIO_CORS_ORIGINS       # the Supabase edge function calls the API server-to-server;
        value: "*"                   # restrict this if a browser ever calls the API directly
      - key: MEIO_OUTPUT_DIR
        value: /tmp/meio-output
